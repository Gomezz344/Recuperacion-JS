<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mokepon</title>
    
</head>
<body>
    <h1>Mokepon</h1>

    <section id="select-pet">
        <h2>Elige tu mascota:</h2>

        <label for="hipodoge">Hipodoge</label>
        <input type="radio" name="pet" id="hipodoge">

        <label for="capipepo">Capipepo</label>
        <input type="radio" name="pet" id="capipepo">

        <label for="ratigueya">Ratigueya</label>
        <input type="radio" name="pet" id="ratigueya">


        <button id="btn-pet">Seleccionar</button>
    </section>

    <section id="select-attack">
        <h2>Elige tu ataque:</h2>
        <p>Tu mascota <span id="pet-player"></span> tiene <span>3</span> vidas</p>
        <p>La mascota <span id="pet-enemy"></span> del enemigo tiene <span>3</span> vidas</p>
        <p>
            <button id="btn-fire">Fire</button>
            <button id="btn-water">Water</button>
            <button id="btn-earth">Earth</button>
        </p>
    </section>

    <section id="messages">
        <p>
            Tu mascota ataco con Fuego, la mascosta del enemigo ataco con Tierra - Win
        </p>
    </section>


    <section id="reset">
        <button id="btn-reset">Reiniciar</button>
    </section>


    <script src="main.js"></script>
    
</body>
</html>
